name: CI/CD Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: target/

      - name: Upload JAR
        uses: actions/upload-artifact@v4.4.0
        with:
          name: artifact
          path: ./target/demo-0.0.2.7-SNAPSHOT.jar

  deploy-STG:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        shell: bash
        run: |
          echo "Deploy STG"

  deploy-PRE:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        shell: bash
        run: |
          echo "Deploy PRE"

  deploy-PRO:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        shell: bash
        run: |
          echo "Deploy PRO"

  SmoketestPre:
    runs-on: ubuntu-latest
    needs: deploy-PRE
    if: github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@v3
      - name: Run Smoketest
        shell: bash
        run: |
          sh 'src/main/scripts/smoketest.sh'

  testeFuncionais:
    runs-on: ubuntu-latest
    needs: SmoketestPre
    if: github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@v3
      - name: Run Functional Tests
        shell: bash
        run: |
          sh 'src/main/scripts/testesFuncionais.sh'

  testePerformance:
    runs-on: ubuntu-latest
    needs: testeFuncionais
    if: github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@v3
      - name: Run Performance Tests
        shell: bash
        run: |
          echo "teste de Performance"

  smoke-Prod:
    runs-on: ubuntu-latest
    needs: deploy-PRO
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Run Smoketest
        shell: bash
        run: |
          sh 'src/main/scripts/smoketest.sh'